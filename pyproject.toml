[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "musecut"
version = "0.21.0"
description = "Agent-native open-source video editor — scriptable, no login, no watermark, MCP-native. Better than CapCut for AI agents."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "MuseCut contributors" }]
requires-python = ">=3.10"
keywords = ["video", "editor", "ffmpeg", "mcp", "agent", "capcut"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.optional-dependencies]
captions = ["faster-whisper>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
musecut = "musecut.cli:main"

[project.urls]
Homepage = "https://github.com/Mahiroyal804/MuseCut"
Repository = "https://github.com/Mahiroyal804/MuseCut"

[tool.setuptools.packages.find]
include = ["musecut*"]
